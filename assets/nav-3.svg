<svg xmlns="http://www.w3.org/2000/svg" width="210" height="44" viewBox="0 0 210 44" role="img" aria-labelledby="t" xml:space="preserve">
<title id="t">Jump to loadout</title>
<style>
  text { font-family: 'JetBrains Mono','Fira Code','SFMono-Regular','Cascadia Mono',Consolas,'Liberation Mono',Menlo,monospace; white-space: pre; }
  .b { font-weight: 700; }
  .glow { filter: drop-shadow(0 0 4px #9fef0088); }
  @keyframes pulse { 0%,100% { opacity: .35 } 50% { opacity: 1 } }
  @keyframes blink { 0%,49% { opacity: 1 } 50%,100% { opacity: 0 } }
  .pulse { animation: pulse 3s ease-in-out infinite; }
  .blink { animation: blink 1.1s steps(1) infinite; }
  .nv { animation: pulse 3s ease-in-out 1.0s infinite; }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
<rect x="1" y="1" width="208" height="42" rx="8" fill="#05080a" stroke="#1d2a22"/>
<rect x="1" y="1" width="208" height="42" rx="8" fill="none" stroke="#9fef00" class="nv"/>
<text x="16" y="27" font-size="12" fill="#6b7d8f">03</text>
<text x="42" y="27.5" font-size="13.5" fill="#9fef00" class="b">LOADOUT</text>
<text x="194" y="27.5" font-size="13" fill="#9fef00" text-anchor="end" class="blink">▸</text>
</svg>
